name: Feature request
description: Propose a scoped APES CIC feature or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be added or improved?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is this needed?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Files, folders, routes, users, workflows, or data in scope.
    validations:
      required: true
  - type: textarea
    id: non_scope
    attributes:
      label: Proposed non-scope
      description: Anything this request should not change.
    validations:
      required: true
  - type: dropdown
    id: website_type
    attributes:
      label: Website type
      options:
        - documentation only
        - static website
        - PHP website
        - MySQL database website
        - CMS
        - custom portal
        - small web application
        - migration
        - custom
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks, privacy, hosting, or release considerations
    validations:
      required: false
